springdoc:
  api-docs:
    # OpenApiSpecTest가 명세를 받아 docs/api/openapi.json과 비교한다
    enabled: true

jg4seasons:
  auth:
    # 테스트 전용 값(비밀 아님). 운영 값은 환경 변수로만 넣는다
    personal-code-pepper: test-pepper-0123456789abcdef0123456789
    jwt-secret: test-jwt-secret-0123456789abcdef0123
  # 사진 저장소는 테스트 설정(TestPhotoStorageConfiguration)의 메모리 구현
  # 프리토킹 임시 키는 테스트 설정(TestRealtimeIssuerConfiguration)의 가짜 — 외부 호출 0
  talk:
    realtime:
      type: fake
    # 요약도 테스트 설정(TestTalkSummarizerConfiguration)의 가짜
    summary:
      type: fake
  word-test:
    storage:
      type: memory
    # 답안지 읽기는 테스트 설정(TestAnswerSheetReaderConfiguration)의 가짜, 워커는 테스트가 runOnce로 직접
    reader:
      type: fake
    worker:
      scheduled: false
