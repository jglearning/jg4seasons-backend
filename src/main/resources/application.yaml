spring:
  application:
    name: jg4seasons-backend
  lifecycle:
    # 종료 신호를 받으면 처리 중인 요청을 이만큼 기다린다(graceful 종료는 기본값). 컨테이너 정지 대기(30초)보다 짧게
    timeout-per-shutdown-phase: 20s
  web:
    # 검증 메시지 등은 서버 로케일·Accept-Language와 무관하게 한국어
    locale: ko
    locale-resolver: fixed
  jpa:
    # 스키마는 Flyway로만 만든다. JPA는 엔티티와 테이블이 맞는지 검증만 한다
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        # 시각은 UTC로 저장한다. 서버 기본 시간대(KST)로 저장되면 9시간 어긋난다
        jdbc:
          time_zone: UTC

management:
  endpoints:
    web:
      exposure:
        # 바깥(Nginx /api/health)에는 readiness만 낸다. 기본값에 기대지 않고 명시한다
        include: health
  endpoint:
    health:
      probes:
        # 배포 스크립트가 /actuator/health/readiness를 보고 새 슬롯으로 옮긴다
        enabled: true
      group:
        readiness:
          # DB에 닿아야 요청을 받을 수 있다. 닿기 전에 UP이면 고장 난 슬롯으로 옮긴다.
          # liveness에는 넣지 않는다(DB가 잠깐 멈출 때 멀쩡한 앱을 죽은 것으로 보지 않게)
          include: readinessState,db

logging:
  pattern:
    # 로그 줄마다 요청 ID(MDC requestId). 오류 응답의 requestId로 로그를 찾는다
    level: "%5p [%X{requestId:-}]"

springdoc:
  api-docs:
    # 운영에서는 API 목록을 공개하지 않는다. test·local 프로파일에서만 켠다
    enabled: false
  # openapi.json이 실행마다 같게(키 정렬) 그리고 읽기 좋게
  writer-with-order-by-keys: true
  writer-with-default-pretty-printer: true
  # 오류 응답은 OpenApiConfig가 Problem 스키마로 직접 싣는다(예외 처리기에서 추론하지 않음)
  override-with-generic-response: false

jg4seasons:
  auth:
    # 비밀값은 환경 변수로만. 비어 있거나 32바이트 미만이면 서버가 뜨지 않는다(AuthProperties)
    personal-code-pepper: ${JG4SEASONS_PERSONAL_CODE_PEPPER:}
    jwt-secret: ${JG4SEASONS_JWT_SECRET:}
    # 운영 프록시가 클라이언트 IP를 넣는 헤더. 비우면 연결 주소만 믿는다
    client-ip-header: ${JG4SEASONS_CLIENT_IP_HEADER:}
  # 음원 서명 쿠키(ADR 0028). 기본 꺼짐. 켜면 칸이 비었거나 개인 키를 못 읽을 때 서버가 뜨지 않는다
  audio:
    signing:
      enabled: ${JG4SEASONS_AUDIO_SIGNING_ENABLED:false}
      key-pair-id: ${JG4SEASONS_AUDIO_SIGNING_KEY_PAIR_ID:}
      # 한 줄 base64(PKCS#8 DER). 비밀값 — 환경 변수로만
      private-key: ${JG4SEASONS_AUDIO_SIGNING_PRIVATE_KEY:}
      # 사이트 호스트를 정확히: https://<호스트>/audio/*
      resource: ${JG4SEASONS_AUDIO_SIGNING_RESOURCE:}
