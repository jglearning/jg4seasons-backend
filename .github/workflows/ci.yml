name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# PR은 새 커밋이 오면 앞 실행을 취소한다. main push는 취소하지 않는다
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - name: 포맷 검사
        run: ./gradlew spotlessCheck

      # test에 Testcontainers(MySQL)·아키텍처 규칙·openapi 명세 비교가 포함된다
      - name: 테스트·빌드
        run: ./gradlew build

      - name: 테스트 리포트 업로드
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: build/reports/tests/
