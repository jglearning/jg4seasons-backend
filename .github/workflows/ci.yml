name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# PR은 새 커밋이 오면 앞 실행을 취소한다. main push는 취소하지 않는다
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - name: 포맷 검사
        run: ./gradlew spotlessCheck

      # test에 Testcontainers(MySQL)·아키텍처 규칙·openapi 명세 비교가 포함된다
      - name: 테스트·빌드
        run: ./gradlew build

      - name: 테스트 리포트 업로드
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: build/reports/tests/

  # 서버 쪽 파일의 검사: 배포 스크립트·시험 음원 스크립트(shellcheck, 실패 경로 시험).
  # Nginx 설정은 build의 NginxConfigTest가 실제 nginx로 본다
  infra:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Shellcheck
        run: >-
          docker run --rm -v "$PWD:/mnt" koalaman/shellcheck:v0.10.0
          /mnt/infra/app/bin/deploy.sh /mnt/infra/app/test/deploy.bats
          /mnt/infra/audio/make-trial-audio.sh /mnt/infra/audio/test/make-trial-audio.bats

      - name: 스크립트 시험(bats)
        run: docker run --rm -v "$PWD:/repo" -w /repo bats/bats:1.11.0 infra/app/test infra/audio/test
